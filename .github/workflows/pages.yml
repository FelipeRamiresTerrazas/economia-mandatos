# Publica reports/ no GitHub Pages a cada push no master que altere o relatório.
# O relatório é gerado localmente (python -m src.main) e versionado; aqui não há build.
name: Publica relatório

on:
  push:
    branches: [master]
    paths: ["reports/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Monta o site
        run: |
          mkdir _site
          cp -r reports/. _site/
          cp reports/relatorio.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

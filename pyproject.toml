[project]
name = "economia-mandatos"
version = "0.1.0"
description = "Indicadores econômicos do Brasil por mandato presidencial, a partir de dados oficiais"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]

# Recortes de período. Única fonte de verdade para datas de mandato.
# Datas inclusivas. fim: null = mandato em curso, vai até o último dado disponível (sem extrapolar).

ano_base_deflacao: 2025          # valores reais a preços médios de 2025 (último ano completo)

mandatos:
  - id: lula1
    nome: Lula 1
    inicio: 2003-01-01
    fim: 2006-12-31

  - id: lula2
    nome: Lula 2
    inicio: 2007-01-01
    fim: 2010-12-31

  - id: dilma1
    nome: Dilma 1
    inicio: 2011-01-01
    fim: 2014-12-31

  - id: dilma2_temer
    nome: Dilma 2 / Temer
    inicio: 2015-01-01
    fim: 2018-12-31
    nota: >
      Bloco analisado inteiro e em dois subperíodos. Corte em 31/08/2016 (julgamento final do
      impeachment). Dilma Rousseff foi afastada em 12/05/2016; de maio a agosto/2016 Michel Temer
      exerceu a presidência interinamente, período que fica no primeiro subperíodo por esta convenção.
      Séries anuais só são apresentadas para o bloco inteiro (2016 não é divisível).
      Em séries trimestrais, 2016T3 é atribuído ao subperíodo Temer.
    subperiodos:
      - id: dilma2
        nome: Dilma 2
        inicio: 2015-01-01
        fim: 2016-08-31
      - id: temer
        nome: Temer
        inicio: 2016-09-01
        fim: 2018-12-31

  - id: bolsonaro
    nome: Bolsonaro
    inicio: 2019-01-01
    fim: 2022-12-31

  - id: lula3
    nome: Lula 3
    inicio: 2023-01-01
    fim: null
    incompleto: true
    nota: Mandato em curso. Apenas dados observados; nenhum valor é anualizado ou extrapolado.

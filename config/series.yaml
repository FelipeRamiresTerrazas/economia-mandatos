# Catálogo de séries. Só entram códigos confirmados nas APIs (nome conferido nos metadados oficiais
# e dados retornados). Data da confirmação em `confirmado_em`.
#
# Campos:
#   id          identificador interno (nome do arquivo em data/raw e data/processed/series)
#   coletor     módulo em src/coleta (ibge, bcb, ipeadata, worldbank, anp)
#   codigo      parâmetros da API da fonte
#   unidade, frequencia, dimensao, inicio_cobertura (observado na confirmação)
#   observacoes ressalvas metodológicas que vão para o relatório

padroes:
  inicio_coleta: 2000-01-01       # coleta desde 2000 para ter o ano anterior a Lula 1 (2002)
  worldbank_paises: [BRA, LCN, UMC, WLD]
  worldbank_nomes:
    BRA: Brasil
    LCN: América Latina e Caribe
    UMC: Renda média-alta
    WLD: Mundo

series:
  # ------------------------------------------------------------------ IBGE / SIDRA
  - id: pib_volume_trim
    nome: PIB - índice de volume trimestral encadeado (média 1995 = 100)
    coletor: ibge
    codigo: {tabela: 1620, variavel: 583, classificacoes: {11255: 90707}}
    unidade: número-índice
    frequencia: trimestral
    dimensao: atividade
    inicio_cobertura: 1996T1
    confirmado_em: 2026-10-16
    observacoes: Sem ajuste sazonal. Base para o crescimento anual a partir de 2024 (contas anuais vão até 2023). Últimos trimestres sujeitos a revisão.

  - id: pib_taxa_acum_ano
    nome: PIB - taxa acumulada ao longo do ano (vs mesmo período do ano anterior)
    coletor: ibge
    codigo: {tabela: 5932, variavel: 6563, classificacoes: {11255: 90707}}
    unidade: '%'
    frequencia: trimestral
    dimensao: atividade
    inicio_cobertura: 1996T1
    confirmado_em: 2026-10-16
    observacoes: No 4º trimestre equivale ao crescimento anual. Usada para conferência do cálculo a partir do índice de volume.

  - id: pib_nominal_trim
    nome: PIB a preços correntes - trimestral
    coletor: ibge
    codigo: {tabela: 1846, variavel: 585, classificacoes: {11255: 90707}}
    unidade: R$ milhões
    frequencia: trimestral
    dimensao: atividade
    inicio_cobertura: 1996T1
    confirmado_em: 2026-10-16

  - id: pib_anual_corrente

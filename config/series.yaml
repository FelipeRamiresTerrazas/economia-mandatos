    confirmado_em: 2026-10-16
    observacoes: Data = último mês do trimestre móvel. Usada para os subperíodos de 2016 e para o dado mais recente.

  - id: rendimento_real_trim
    nome: Rendimento médio mensal real habitual de todos os trabalhos (PNAD Contínua)
    coletor: ibge
    codigo: {tabela: 5436, variavel: 5933, classificacoes: {2: 6794}}
    unidade: R$ (a preços do último trimestre divulgado)
    frequencia: trimestral
    dimensao: trabalho
    inicio_cobertura: 2012T1
    confirmado_em: 2026-10-16
    observacoes: >
      O IBGE já deflaciona a série para o trimestre mais recente; a cada divulgação o nível de toda a
      série muda. A API não retorna valores de 2020T2 a 2022T1 (verificado em 2026-10-17); o gráfico
      mostra a lacuna e nenhum valor é preenchido.

  - id: informalidade_trim

    unidade: R$ milhões
    frequencia: anual
    dimensao: atividade
    inicio_cobertura: '1996'
    confirmado_em: 2026-10-16
    observacoes: Contas anuais definitivas disponíveis até 2023.

  - id: pib_anual_var_volume

    frequencia: anual
    dimensao: populacao
    inicio_cobertura: '1996'
    confirmado_em: 2026-10-16

  - id: populacao_estimada
    nome: População residente estimada
    coletor: ibge
    codigo: {tabela: 6579, variavel: 9324}
    unidade: pessoas
    frequencia: anual
    dimensao: populacao
    inicio_cobertura: '2001'
    confirmado_em: 2026-10-16
    observacoes: >
      Sem estimativa em 2007, 2010, 2022 e 2023 (anos de contagem/censo). Estimativas posteriores ao
      Censo 2022 têm nível diferente das anteriores (2021 = 213,3 mi; 2024 = 212,6 mi). Afeta séries per capita.

